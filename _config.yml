# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the
# server process.

# Basic Site Settings
locale: "en-US"
site_theme: "default"
title: "Abhishek Reddy Malreddy"
title_separator: "-"
name: &name "Abhishek Reddy Malreddy"
description: &description "MS in Artificial Intelligence Engineering at Carnegie Mellon University, specializing in materials science and engineering."
url: "https://abhishekredy18.github.io" # your custom domain
baseurl: "" # leave blank for root
repository: "abhishekredy18/abhishekredy18.github.io"

# Site Author - controls the author sidebar
author:
  avatar: "profile.png"
  name: "Abhishek Reddy Malreddy"
  pronouns:
  bio: "I’m a Master’s student in AI Engineering at Carnegie Mellon with a background in Materials Science, Autonomous Navigation, and Mechanical Engineering. I’m passionate about perception and prediction and thrive on collaborating across disciplines to build AI solutions that solve real-world problems, such as improving urban safety with edge-deployed vision systems or accelerating materials discovery through data-driven models. I enjoy creating systems that work reliably in practice and deliver measurable impact."
  location: "Pittsburgh, PA"
  employer: "Carnegie Mellon University"
  uri: "https://www.abhishekreddy.one"
  email: "amalredd@andrew.cmu.edu"

  # Academic websites
  academia:
  arxiv:
  googlescholar: "https://scholar.google.com/citations?user=KNUhL4oAAAAJ&hl=en"
  impactstory:
  orcid:
  semantic:
  pubmed:
  researchgate:
  scopus:

  # Repositories and software development
  bitbucket:
  codepen:
  dribbble:
  github: "abhishekredy18"
  kaggle:
  stackoverflow:

  # Social media profiles
  bluesky:
  facebook:
  flickr:
  foursquare:
  goodreads:
  google_plus:
  keybase:
  instagram:
  lastfm:
  linkedin: "abhishekmalreddy"
  mastodon:
  medium:
  pinterest:
  soundcloud:
  steam:
  telegram:
  tumblr:
  twitter:
  vine:
  weibo:
  wikipedia:
  xing:
  youtube:
  zhihu:

# Publication Category
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser: # fallback teaser image in /images/
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider: # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname:
  discourse:
    server:
  facebook:
    appid:
    num_posts:
    colorscheme:
  staticman:
    allowedFields: ['name', 'email', 'url', 'message']
    branch: "gh-pages"
    commitMessage: "New comment."
    filename: comment-{@timestamp}
    format: "yml"
    moderation: true
    path: "_data/comments/{options.slug}"
    requiredFields: ['name', 'email', 'message']
    transforms:
      email: "md5"
    generatedFields:
      date:
        type: "date"
        options:
          format: "iso8601"

atom_feed:
  hide: false
  path:

# SEO Related
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

# Social Sharing
twitter:
  username: &twitter
disable:
facebook:
  username:
  app_id:
  publisher:
og_image:

social:
  type: # Person or Organization (defaults to Person)
  name: # If different from site name
  links: # An array of social profile URLs, e.g. ["https://twitter.com/...", ...]

# Analytics
analytics:
  provider: false # false (default), "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id:

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: "America/New_York"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /:tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development